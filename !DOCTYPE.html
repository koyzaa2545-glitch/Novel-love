<style>

.btn.del{color:var(--bad)}

main{max-width:1050px;margin:0 auto;padding:16px 14px 80px}

@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
label.l{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.badge{display:inline-block;border-radius:99px;padding:0 9px;font-size:12px;color:#fff}
.b-planned{background:#a79f93}.b-open{background:var(--warn)}.b-dev{background:var(--teal)}.b-done{background:var(--ok)}

.wrap{display:grid;grid-template-columns:200px 1fr;gap:14px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.chl button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;margin-bottom:6px;cursor:pointer}

.src{font-size:13px}.src a{color:var(--teal)}
.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:520px;overflow:auto}
.pulse{animation:p 1.2s infinite}@keyframes p{50%{opacity:.4}}

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const num=v=>{v=parseInt(v,10);return isNaN(v)?'':v};
const KEY='thai-novel-studio-v1';
const TYPES=['ปมหลัก','ความสัมพันธ์','ปริศนา/ความลับ','ความขัดแย้ง','ปมอดีต','ลางบอกเหตุ'];
const ST={planned:'ยังไม่เปิด',open:'เปิดแล้ว',dev:'กำลังคลี่คลาย',done:'เฉลยแล้ว'};
const ACT={plant:'วางปม',advance:'ขยับปม',twist:'หักมุม',resolve:'เฉลย'};
const GENRES=['โรแมนติกคอมเมดี้','ดราม่าครอบครัว','ย้อนยุคไทย (รัตนโกสินทร์)','ย้อนยุคจีนโบราณ','นิยายวาย (BL)','หญิงรักหญิง (GL/ยูริ)','สยองขวัญ/ผีไทย','สืบสวนสอบสวน','แฟนตาซี','ออฟฟิศโรแมนซ์','ทะลุมิติ/เกิดใหม่','นิยายแชต'];
const SETTINGS=['กรุงเทพฯ ยุคปัจจุบัน','หอพัก/มหาวิทยาลัยไทย','ออฟฟิศบริษัทในกรุงเทพฯ','ต่างจังหวัด/ชนบทไทย','ตระกูลเจ้าสัว/ธุรกิจครอบครัว','บ้านไทยเก่า/เรือนขุนนางสมัยรัตนโกสินทร์','ชุมชนไทยเชื้อสายจีน','วงการบันเทิง/ซีรีส์','โรงพยาบาล','ความเชื่อและผีไทย'];
const QRULES=['ใช้ภาษาพูดสบายๆ ย่อหน้าสั้น บทสนทนาเยอะ','ไม่มีฉากรุนแรงหรือเกี่ยวกับเพศที่โจ่งแจ้ง (ระดับ 15+)','ท้ายตอนต้องมีปมให้อยากอ่านต่อ','พระเอก/ตัวเอกพูดน้อย ใช้การกระทำสื่อใจ','มีอารมณ์ขันแทรกเบาๆ'];
const TREND_SRC=['นิยายวาย (BL)','หญิงรักหญิง (GL/ยูริ)','นิยายรัก','จีนโบราณ/ย้อนยุค','นิยายแชต'];
const TREND_GEN=['ผีไทย/ไสยศาสตร์','ดราม่าตระกูล/แย่งมรดก','ออฟฟิศโรแมนซ์','ย้อนยุคไทย (รัตนโกสินทร์)','ทะลุมิติ/เกิดใหม่','สืบสวนสอบสวน','ดราม่าครอบครัว'];

function newNovel(){return{id:uid('n'),title:'เรื่องใหม่ของฉัน',genre:'',tags:[],setting:'',tone:'',pov:'บุรุษที่สาม (รู้ใจตัวเอก)',premise:'',planned:20,rules:[],trendNotes:'',trendPaste:'',chars:[],threads:[],facts:[],chapters:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let S=load();
if(!S||!Array.isArray(S.novels)||!S.novels.length){const n=newNovel();S={cur:n.id,novels:[n]}}
if(!S.novels.find(x=>x.id===S.cur))S.cur=S.novels[0].id;
let tab='bible',curCh=null,busy='',ctl=null,SAMPLE,starter=null,trendOut='',lastFind=null,tmr;
const N=()=>S.novels.find(x=>x.id===S.cur);
const save=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));$('#saved').textContent='บันทึกในเบราว์เซอร์แล้ว'}catch(e){$('#saved').textContent='บันทึกในเบราว์เซอร์ไม่ได้ — โปรดกดสำรองข้อมูล'}},250)};
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms)}
function ask(msg,ok='ตกลง'){return new Promise(res=>{const m=$('#modal');m.innerHTML=`<div class="mb"><div class="mc"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mn">ยกเลิก</button><button class="btn pri" id="my">${esc(ok)}</button></div></div></div>`;$('#mn').onclick=()=>{m.innerHTML='';res(false)};$('#my').onclick=()=>{m.innerHTML='';res(true)}})}
let IS_GEMINI=false;
const GK='thai-novel-gemini';
const DEFAULT_KEY='AQ.Ab8RN6K7E6GmBZxnkr-5cWdLaYnQt3BzYeDgFLJrRtgHy5rdYA';
function gcfg(){let c={};try{c=JSON.parse(localStorage.getItem(GK))||{}}catch(e){}return{key:c.key||DEFAULT_KEY,model:c.model||''}}
function makeGemini(){
 const call=async(prompt,o,json)=>{
  const cfg=gcfg();if(!cfg.key)throw{code:'no_key'};
  const model=cfg.model||'gemini-flash-latest';
  const body={contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:16384}};
  if(json)body.generationConfig.responseMimeType='application/json';
  let res;
  try{res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},body:JSON.stringify(body),signal:o&&o.signal})}
  catch(e){throw{code:(e&&e.name==='AbortError')?'cancelled':'upstream_error'}}
  if(!res.ok){let m='';try{m=await res.text()}catch(_){}
   if(res.status===429)throw{code:'rate_limited'};
   if(res.status===400&&/API key not valid|API_KEY_INVALID/i.test(m)||res.status===401||res.status===403)throw{code:'bad_key'};
   if(res.status===404)throw{code:'bad_model'};
   throw{code:'upstream_error'}}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='',truncated=false;
  try{
   for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const ln of lines){if(!ln.startsWith('data:'))continue;const s=ln.slice(5).trim();if(!s)continue;let j;try{j=JSON.parse(s)}catch(_){continue}
     if(j.promptFeedback&&j.promptFeedback.blockReason)throw{code:'refused'};
     const c=j.candidates&&j.candidates[0];if(!c)continue;
     const parts=(c.content&&c.content.parts)||[];let add='';for(const x of parts)if(x.text&&!x.thought)add+=x.text;
     if(add){text+=add;if(o&&o.onText)o.onText({text})}
     if(c.finishReason==='MAX_TOKENS')truncated=true;
     if(c.finishReason==='SAFETY'||c.finishReason==='PROHIBITED_CONTENT')throw{code:'refused'}}}
  }catch(e){if(e&&e.code)throw Object.assign(e,{text:e.text||text});throw{code:(e&&e.name==='AbortError')?'cancelled':'upstream_error',text}}
  return{text,truncated}};
 const s=(p,o)=>call(p,o,false);
 s.json=async(p,o)=>{const r=await call(p,o,true);let x=r.text.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try{return JSON.parse(x)}catch(e){const a=x.indexOf('{'),b=x.lastIndexOf('}');if(a>=0&&b>a){try{return JSON.parse(x.slice(a,b+1))}catch(_){}}throw{code:'invalid_json'}}};
 return s}
async function getSample(){if(SAMPLE!==undefined)return SAMPLE;try{SAMPLE=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){SAMPLE=null}
 if(!SAMPLE){SAMPLE=makeGemini();IS_GEMINI=true}return SAMPLE}
function errCopy(e){const c=e&&e.code;return({not_granted:'ยังไม่ได้อนุญาตให้หน้านี้ใช้ Claude',sampling_disabled:'บัญชีนี้ใช้ Claude ในหน้านี้ไม่ได้',rate_limited:'ใช้ถี่เกินไปหรือถึงขีดจำกัด ลองใหม่ภายหลัง',invalid_json:'เอไอตอบกลับในรูปแบบที่อ่านไม่ได้ กดลองอีกครั้ง',prompt_too_large:'ข้อมูลเรื่องยาวเกินไป ลองตัดสรุปตอนเก่า',refused:'เอไอไม่รับคำสั่งนี้ ลองปรับคำสั่ง',upstream_error:'การเชื่อมต่อสะดุด ลองใหม่อีกครั้ง',no_key:'ยังไม่ได้ใส่ Gemini API key — กดปุ่ม “ตั้งค่า Gemini” ที่แถบด้านบน',bad_key:'Gemini API key ไม่ถูกต้องหรือไม่มีสิทธิ์ ตรวจ key อีกครั้ง',bad_model:'ไม่พบชื่อโมเดลนี้ ลองเปลี่ยนชื่อโมเดลในตั้งค่า Gemini',cancelled:''})[c]??('เกิดข้อผิดพลาด ('+(c||'?')+')')}

/* ---------- ปม: สถานะ / ตรวจ ---------- */
const findT=(nov,id)=>nov.threads.find(t=>t.id===id);
const findC=(nov,id)=>nov.chars.find(c=>c.id===id);
function recalc(t){const L=t.log||[];if(L.some(e=>e.action==='resolve'))t.status='done';else if(L.some(e=>e.action==='advance'||e.action==='twist'))t.status='dev';else if(L.some(e=>e.action==='plant'))t.status='open';else t.status=t.base||'planned'}
function stateBefore(t,n){const L=t.log||[];if(!L.length)return t.status;const B=L.filter(e=>e.ch<n);if(B.some(e=>e.action==='resolve'))return'done';if(B.some(e=>e.action==='advance'||e.action==='twist'))return'dev';if(B.some(e=>e.action==='plant'))return'open';return t.base&&t.base!=='planned'?t.base:'planned'}
function sym(nov){nov.threads.forEach(t=>{t.links=(t.links||[]).filter(id=>id!==t.id&&findT(nov,id));t.links.forEach(id=>{const o=findT(nov,id);if(o&&!o.links.includes(t.id))o.links.push(t.id)})})}
function lastN(nov){return Math.max(0,...nov.chapters.map(c=>c.n))}
function audit(nov){const out=[],last=lastN(nov),next=last+1;
 nov.threads.forEach(t=>{const nm=`“${t.title}”`;const L=t.log||[];
  if((t.status==='open'||t.status==='dev')&&t.due&&t.due<next)out.push({lv:'high',id:t.id,text:`ปม ${nm} เลยกำหนดเฉลย (ตอน ${t.due}) แต่ยังไม่ถูกเฉลย`});
  if(t.status==='planned'&&t.plant&&t.plant<next)out.push({lv:'mid',id:t.id,text:`ปม ${nm} ควรถูกวางตั้งแต่ตอน ${t.plant} แต่ยังไม่ได้วาง`});
  if(t.status==='open'||t.status==='dev'){const lt=Math.max(0,...L.map(e=>e.ch));if(last>=4&&last-lt>=4)out.push({lv:'mid',id:t.id,text:`ปม ${nm} ไม่ถูกแตะมา ${last-lt} ตอนแล้ว — ระวังปมหลุด`})}
  if(t.status==='done'&&!(t.resolution||'').trim())out.push({lv:'low',id:t.id,text:`ปม ${nm} เฉลยแล้วแต่ยังไม่มีบันทึกว่าเฉลยอย่างไร`});
  if(!t.links.length&&!t.chars.length)out.push({lv:'mid',id:t.id,text:`ปม ${nm} โดดเดี่ยว ไม่เชื่อมกับตัวละครหรือปมอื่นเลย`});
  else if(!t.links.length&&nov.threads.length>1)out.push({lv:'low',id:t.id,text:`ปม ${nm} ยังไม่ผูกกับปมอื่น`});
  if(t.due&&t.plant&&t.due<t.plant)out.push({lv:'high',id:t.id,text:`ปม ${nm} กำหนดเฉลย (ตอน ${t.due}) ก่อนตอนวางปม (ตอน ${t.plant})`});
  if(!(t.answer||'').trim()&&t.status!=='done')out.push({lv:'low',id:t.id,text:`ปม ${nm} ยังไม่มีคำเฉลยที่วางแผนไว้ (เอไอจะวางเงื่อนงำได้แม่นขึ้นถ้ามี)`});
 });
 const o={high:0,mid:1,low:2};return out.sort((a,b)=>o[a.lv]-o[b.lv])}
function unapply(nov,n){const touched=[];nov.threads.forEach(t=>{const b=t.log.length;t.log=t.log.filter(e=>e.ch!==n);if(t.log.length!==b)touched.push(t)});nov.facts=nov.facts.filter(f=>f.ch!==n);nov.threads=nov.threads.filter(t=>t.fromCh!==n);nov.threads.forEach(t=>{t.links=t.links.filter(id=>findT(nov,id))});touched.forEach(t=>{if(findT(nov,t.id)){recalc(t);if(t.status!=='done'&&t.log.every(e=>e.action!=='resolve'))t.resolution=t.resolution_manual||''}})}

/* ---------- พรอมต์ ---------- */
const GUIDE=`กติกาภาษาและบริบทไทย:
- เขียนภาษาไทยแบบนิยายไทยที่เป็นธรรมชาติ ไม่แปลตรงจากภาษาอื่น ไม่ใช้สำนวนจีนหรืออังกฤษแปลสดเว้นแต่แนวย้อนยุคจีนที่ระบุ
- สรรพนามและคำลงท้าย (ฉัน/เรา/ผม/ดิฉัน/เธอ/คุณ/พี่/น้อง/ค่ะ/ครับ/คะ/นะ/จ้ะ ฯลฯ) ต้องสอดคล้องอายุ สถานะ ความสัมพันธ์ และคงที่ตามโปรไฟล์ตัวละครทุกตอน
- ใส่รายละเอียดวัฒนธรรมไทยอย่างเป็นธรรมชาติเมื่อเหมาะ (อาหาร ศาสนา/ความเชื่อ ประเพณี สถานที่ การเรียกญาติและลำดับอาวุโส) ไม่ยัดเยียด
- ย่อหน้าสั้น อ่านบนมือถือสบาย บทสนทนาใช้ภาษาพูดที่สมจริง ใช้เครื่องหมายคำพูด “ ”
- แสดงอารมณ์ผ่านการกระทำ บรรยากาศ และบทพูด มากกว่าการบอกตรงๆ`;
function ctxBlock(nov,n){
 const tn=id=>(findT(nov,id)||{}).title||'?',cn=id=>(findC(nov,id)||{}).name||'?';
 const prev=nov.chapters.filter(c=>c.n<n).sort((a,b)=>a.n-b.n);

function writePrompt(nov,c,mode){

 if(last&&last.text)p+=`\n=== ท้ายตอนก่อนหน้า (ต่อให้เนียน) ===\n${last.text.slice(-1500)}\n`;
 p+=`\n=== คำสั่งสำหรับตอนที่ ${c.n}${c.title?` “${c.title}”`:''} ===\nความยาว: ${lenMap[c.len||'mid']}\n`;
 p+=`สิ่งที่ผู้เขียนต้องการให้เกิดในตอนนี้: ${c.req||'(ไม่ได้ระบุ ให้ดำเนินเรื่องตามพล็อตและปมที่ค้างอยู่อย่างสมเหตุสมผล)'}\n`;
 p+=`ปมที่ต้องเล่นในตอนนี้:\n`+(plan.length?plan.map(x=>{const t=findT(nov,x.threadId);return`- [${t.id}] ${t.title}: ${ACT[x.action]}`}).join('\n'):'- (ไม่ได้เลือก)')+'\n';
 p+=`\nกติกาเหล็กเรื่องปมและความต่อเนื่อง:
1. คำนิยาม: วางปม=ฝังเงื่อนงำให้ผู้อ่านเห็นแต่ยังไม่อธิบาย | ขยับปม=เผยทีละน้อยให้คืบหน้า | หักมุม=พลิกที่ยังสอดคล้องกับเงื่อนงำเดิมและคำเฉลยที่วางแผน | เฉลย=คลี่คลายสมเหตุสมผล โยงกลับถึงเงื่อนงำที่วางไว้ทุกจุด
2. ปมที่ไม่ได้สั่งให้เล่น: ห้ามเฉลย ห้ามเปลี่ยนความจริงของปม ปล่อยค้างตามเดิม แต่ถ้าเกี่ยวข้องกับฉากโดยธรรมชาติให้อ้างถึงแนบเนียน
3. ปมที่ถูกเล่นและมีปมผูกกัน: ต้องสะท้อนผลกระทบต่อปมที่ผูกกันอย่างน้อยหนึ่งจุด
4. ห้ามสร้างตัวละครสำคัญใหม่หรือข้อเท็จจริงที่ขัดกับคัมภีร์ ตัวละคร ปม และข้อเท็จจริงด้านบน ตัวละครรองใหม่ได้เท่าที่จำเป็น
5. ปมที่เลยกำหนดเฉลยแล้ว ถ้าไม่ได้สั่งให้เฉลย ให้เล่นเป็นนัยหรือมีเหตุผลในเรื่องว่าทำไมยังค้าง
6. เมื่อสร้างปมใหม่โดยธรรมชาติ ให้ผูกกับตัวละครหรือปมที่มีอยู่เสมอ ไม่สร้างปมลอยๆ\n`;
 if(mode==='continue')p+=`\n=== ข้อความตอนนี้ที่เขียนไปแล้ว (ถูกตัดกลางคัน) ===\n${c.text.slice(-2500)}\n\nให้เขียนต่อจากประโยคสุดท้ายทันที ห้ามทวนข้อความเดิม ห้ามเขียนหัวข้อซ้ำ แล้วจบตอนอย่างสมบูรณ์`;
 else p+=`\nรูปแบบคำตอบ: บรรทัดแรกเป็นชื่อตอนในรูป “# ชื่อตอน” แล้วเว้นบรรทัด ตามด้วยเนื้อเรื่องล้วน ไม่มีคำอธิบายนอกเรื่อง ไม่มีสรุปท้ายตอน`;
 return p}

 "newThreads":[{"title":"","type":"ปมหลัก|ความสัมพันธ์|ปริศนา/ความลับ|ความขัดแย้ง|ปมอดีต|ลางบอกเหตุ","desc":"","due":null,"links":["threadId ที่เกี่ยวข้อง"],"chars":["ชื่อตัวละครที่เกี่ยวข้อง"]}],

กฎการตรวจ:

function setBusy(b){busy=b;render()}
function stop(){if(ctl)ctl.abort()}
async function writeChapter(mode){
 const nov=N(),c=curChapter();if(!c||busy)return;
 const sample=await getSample();if(!sample)return toast('เปิดหน้านี้ในมุมมองที่ใช้เอไอได้ก่อน (ผ่าน Claude)');
 if(mode==='new'&&c.text&&c.text.trim()&&!await ask('ตอนนี้มีเนื้อหาอยู่แล้ว ต้องการให้เอไอเขียนทับทั้งตอนหรือไม่?','เขียนทับ'))return;
 if(mode==='new'&&c.analyzed){unapply(nov,c.n);c.analyzed=false;c.events=[];c.issues=[]}
 const base=mode==='continue'?c.text.replace(/\s+$/,'')+'\n\n':'';
 const prompt=writePrompt(nov,c,mode);ctl=new AbortController();busy='write';render();
 const ta=()=>$('#chText');let live='';
 try{
  const r=await sample(prompt,{signal:ctl.signal,cache:false,onText:({text})=>{live=text;c.text=base+text;const t=ta();if(t){t.value=c.text;t.scrollTop=t.scrollHeight}}});
  let txt=r.text;
  if(mode==='new'){const m=txt.match(/^\s*#\s*(.+)\n+/);if(m){c.title=c.title&&!/^ตอนที่/.test(c.title)?c.title:m[1].trim().replace(/^ตอนที่\s*\d+\s*[:：-]?\s*/,'');txt=txt.slice(m[0].length)}}
  c.text=base+txt;c.trunc=!!r.truncated;save();
 }catch(e){if(e.text){c.text=base+e.text;c.trunc=true}const m=errCopy(e);if(m)toast(m)}
 ctl=null;busy='';render();save()}
async function analyze(){
 const nov=N(),c=curChapter();if(!c||busy)return;if(!(c.text||'').trim())return toast('ยังไม่มีเนื้อหาตอน');
 const sample=await getSample();if(!sample)return toast('ใช้เอไอไม่ได้ในมุมมองนี้');
 if(c.analyzed){unapply(nov,c.n)}
 const prompt=analyzePrompt(nov,c);ctl=new AbortController();busy='analyze';render();
 try{
  const r=await sample.json(prompt,{signal:ctl.signal,cache:false});
  const ev=[],issues=Array.isArray(r.issues)?r.issues.filter(i=>i&&i.text).map(i=>({severity:['high','mid','low'].includes(i.severity)?i.severity:'mid',text:String(i.text)})):[];
  (Array.isArray(r.events)?r.events:[]).forEach(x=>{const t=findT(nov,x&&x.threadId);if(!t||!ACT[x.action])return;let a=x.action;const sb=stateBefore(t,c.n);
   if(sb==='done'){issues.push({severity:'high',text:`ตอนนี้แตะปม “${t.title}” ที่เฉลยจบไปแล้ว (${ACT[a]})`});return}
   if(a==='plant'&&sb!=='planned')a='advance';
   if((a==='advance'||a==='twist'||a==='resolve')&&sb==='planned'&&!t.log.some(e=>e.action==='plant'))t.log.push({ch:c.n,action:'plant',note:'เปิดปมในตอนนี้'});
   t.log.push({ch:c.n,action:a,note:String(x.note||'').slice(0,200)});if(a==='resolve'){t.resolution=String(x.note||t.resolution||'')}
   ev.push({threadId:t.id,action:a,note:String(x.note||'')});recalc(t)});
  (Array.isArray(r.newFacts)?r.newFacts:[]).forEach(f=>{if(f)nov.facts.push({id:uid('f'),text:String(f),ch:c.n})});
  (Array.isArray(r.newThreads)?r.newThreads:[]).forEach(x=>{if(!x||!x.title)return;const t={id:uid('t'),title:String(x.title),type:TYPES.includes(x.type)?x.type:'ปริศนา/ความลับ',desc:String(x.desc||''),status:'open',base:'open',plant:c.n,due:num(x.due),answer:'',links:(x.links||[]).filter(id=>findT(nov,id)),chars:(x.chars||[]).map(nm=>(nov.chars.find(ch=>ch.name===nm)||{}).id).filter(Boolean),resolution:'',log:[{ch:c.n,action:'plant',note:'เปิดปมในตอนนี้'}],fromCh:c.n};nov.threads.push(t);ev.push({threadId:t.id,action:'plant',note:'ปมใหม่: '+t.title})});
  sym(nov);c.summary=String(r.summary||'');c.events=ev;c.issues=issues;c.analyzed=true;save();
  toast(issues.length?`บันทึกแล้ว พบข้อสังเกต ${issues.length} ข้อ`:'บันทึกตอนและอัปเดตปมแล้ว ไม่พบความขัดแย้ง');
 }catch(e){const m=errCopy(e);if(m)toast(m)}
 ctl=null;busy='';render()}
async function rewrite(instr){

 if(!instr.trim())return toast('พิมพ์คำสั่งแก้ก่อน');

 ctl=new AbortController();busy='write';const old=c.text;render();
 try{const r=await sample(prompt,{signal:ctl.signal,cache:false,onText:({text})=>{c.text=text;const t=$('#chText');if(t)t.value=text}});c.text=r.text;c.trunc=!!r.truncated;c.analyzed=false;toast('แก้แล้ว — กด “บันทึกตอน & อัปเดตปม” เพื่ออัปเดตปมอีกครั้ง')}
 catch(e){c.text=old;const m=errCopy(e);if(m)toast(m)}
 ctl=null;busy='';render();save()}

 T.forEach((t,i)=>{const a=2*Math.PI*i/T.length-Math.PI/2;pos[t.id]=[cx+215*Math.cos(a),cy+140*Math.sin(a)]});
 let e='',seen={};T.forEach(t=>t.links.forEach(id=>{const k=[t.id,id].sort().join();if(seen[k]||!pos[id])return;seen[k]=1;e+=`<line x1="${pos[t.id][0]}" y1="${pos[t.id][1]}" x2="${pos[id][0]}" y2="${pos[id][1]}" stroke="#c9bda8" stroke-width="1.6"/>`}));

  n+=`<circle cx="${x}" cy="${y}" r="9" fill="${col[t.status]}" stroke="${iso?'#c0392b':'#fff'}" stroke-width="${iso?3:2}"/><text x="${x+dx}" y="${y+dy}" text-anchor="${anc}" font-size="12.5" fill="#2b2622">${esc(lab)}</text>`});
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:380px">${e}${n}</svg><div class="muted row" style="gap:12px">${Object.keys(ST).map(k=>`<span><span class="badge b-${k}">&nbsp;</span> ${ST[k]}</span>`).join('')}<span>วงแดง = ปมโดดเดี่ยว</span></div>`}

 ${rel.length?`<div class="plan">${rel.map(t=>{const st=stateBefore(t,n);const od=(st==='open'||st==='dev')&&t.due&&t.due<=n;return`<div>${esc(t.title)} <span class="badge b-${st}">${ST[st]}</span>${od?' <span style="color:var(--bad)">⚠ ถึงกำหนดเฉลย</span>':''}${t.due?` <span class="muted">(เฉลยตอน ${t.due})</span>`:''}</div><select data-p="${t.id}"><option value="">— ไม่แตะ —</option>${Object.keys(ACT).map(k=>`<option value="${k}" ${plan[t.id]===k?'selected':''}>${ACT[k]}</option>`).join('')}</select>`}).join('')}</div>`:'<p class="muted">ยังไม่มีปม — ไปเพิ่มในแท็บ “ปม” ก่อนเพื่อให้เอไอรักษาความต่อเนื่อง</p>'}
 ${a.length?`<details style="margin-top:8px"><summary>⚠ มีเรื่องควรตรวจ ${a.length} ข้อ</summary>${a.map(x=>`<div class="warn ${x.lv}">${esc(x.text)}</div>`).join('')}</details>`:''}
 <div class="row" style="margin-top:12px"><button class="btn pri" data-a="write|new" ${dis}>${busy==='write'?'<span class="pulse">กำลังเขียน…</span>':'✍️ ให้เอไอเขียนตอนนี้'}</button>${busy?'<button class="btn" data-a="stop">⏹ หยุด</button>':''}${c.trunc&&!busy?'<button class="btn" data-a="write|continue">↪ เขียนต่อ (ถูกตัดกลางคัน)</button>':''}</div></div>
 <div class="card"><textarea id="chText" class="story" data-b="h|${c.id}|text" placeholder="เนื้อเรื่องจะขึ้นที่นี่ แก้ไขเองได้ทุกจุด">${esc(c.text)}</textarea>
 <div class="muted">${(c.text||'').length.toLocaleString()} ตัวอักษร</div>
 <div class="row" style="margin-top:8px"><button class="btn pri" data-a="analyze" ${dis}>${busy==='analyze'?'<span class="pulse">เอไอกำลังตรวจ…</span>':'✅ บันทึกตอน & อัปเดตปม (เอไอตรวจ)'}</button><button class="btn" data-a="copyCh">คัดลอกเนื้อเรื่อง</button><button class="btn del" data-a="delCh">ลบตอนนี้</button></div>
 <div class="row" style="margin-top:8px"><input type="text" id="tweakIn" placeholder="สั่งแก้ เช่น ทำให้ฉากทะเลาะดุเดือดขึ้น / ลดบทบรรยาย เพิ่มบทสนทนา" style="flex:1"><button class="btn" data-a="tweak" ${dis}>แก้ตามสั่ง</button></div></div>
 ${c.analyzed?`<div class="card"><h3>ผลตรวจความต่อเนื่อง</h3><p><b>สรุปตอน:</b> ${esc(c.summary)}</p>${c.events.length?`<b>ปมที่ขยับ</b><ul class="log">${c.events.map(e=>`<li>${esc((findT(nov,e.threadId)||{title:'?'}).title)} → ${ACT[e.action]}: ${esc(e.note)}</li>`).join('')}</ul>`:''}${c.issues.length?`<b>ข้อสังเกต</b>${c.issues.map(i=>`<div class="warn ${i.severity==='high'?'high':i.severity==='low'?'low':''}">${esc(i.text)}</div>`).join('')}<button class="btn" data-a="fix" ${dis}>🛠 ให้เอไอแก้ตามข้อสังเกต</button>`:'<div class="ok">ไม่พบความขัดแย้งกับของเดิม</div>'}</div>`:''}
 </div></div>`}
function tabTrend(nov){
 const tg=(a)=>a.map(t=>`<button class="chip ${nov.tags.includes(t)?'on':''}" data-a="trendTag" data-v="${esc(t)}">${esc(t)}</button>`).join('');
 return`<div class="card"><h3>🔗 เปิดดูอันดับสดจากแพลตฟอร์ม</h3><p class="muted">หน้านี้ดึงข้อมูลจากเว็บภายนอกโดยตรงไม่ได้ ให้เปิดดูเอง แล้วคัดลอกรายชื่อ/อันดับมาวางในช่องด้านล่างให้เอไอวิเคราะห์</p>
 <div class="row"><a class="btn" href="https://www.readawrite.com" target="_blank" rel="noopener">readAwrite ↗</a><a class="btn" href="https://www.tunwalai.com" target="_blank" rel="noopener">Tunwalai (ธัญวลัย) ↗</a><a class="btn" href="https://www.mebmarket.com" target="_blank" rel="noopener">MEB ↗</a></div>
 <label class="l">วางอันดับ/ชื่อเรื่อง/แท็กที่คัดลอกมา</label><textarea data-b="n||trendPaste" style="min-height:120px" placeholder="เช่น Top 20 นิยายยอดนิยมสัปดาห์นี้ พร้อมหมวดหมู่และแท็ก">${esc(nov.trendPaste)}</textarea></div>
 <div class="card"><h3>📊 สิ่งที่ค้นเจอ (ณ 30 ต.ค. 2569)</h3><ul class="src">
 <li><b>MEB:</b> นิยายวายเป็นหมวดครองแชมป์ในหมู่นักอ่าน และหญิงรักหญิง (GL) มาแรงน่าจับตา; MEB มีผู้ลงทะเบียนราว 15 ล้านบัญชี — <a href="https://www.infoquest.co.th/2026/591246" target="_blank" rel="noopener">InfoQuest 2026</a></li>
 <li><b>readAwrite:</b> แนวเด่นที่แพลตฟอร์มระบุคือ นิยายรัก จีนโบราณ วาย ยูริ และการ์ตูน/โดจินชิ มีระบบ pre-order และเป็นแพลตฟอร์มในเครือ MEB — <a href="https://apps.apple.com/it/app/readawrite-%E0%B8%A3-%E0%B8%94%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3-%E0%B8%95/id1295087414" target="_blank" rel="noopener">App Store</a>, <a href="https://www.lazada.co.th/blog/%E0%B9%80%E0%B8%A7%E0%B9%87%E0%B8%9A%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%99%E0%B8%B4%E0%B8%A2%E0%B8%B2%E0%B8%A2/" target="_blank" rel="noopener">Lazada Blog</a></li>
 <li><b>นิยายแชต:</b> รายงานของไทยรัฐระบุว่าแอปนิยายแชตในไทยมีสองแอปคือ Joylada และ readAwrite — <a href="https://www.thairath.co.th/scoop/1766936" target="_blank" rel="noopener">ไทยรัฐ</a></li>
 <li><b>Tunwalai:</b> เป็นแอปอ่าน-เขียนนิยายที่ให้สนับสนุนนักเขียนได้ — <a href="https://apps.apple.com/th/app/%E0%B8%98-%E0%B8%8D%E0%B8%A7%E0%B8%A5-%E0%B8%A2-%E0%B8%99-%E0%B8%A2%E0%B8%B2%E0%B8%A2%E0%B8%AD%E0%B8%AD%E0%B8%99%E0%B9%84%E0%B8%A5%E0%B8%99/id1087664350" target="_blank" rel="noopener">App Store</a> (ยังไม่พบข้อมูลอันดับแนวที่ยืนยันได้)</li></ul>
 <p class="muted">ข้างต้นเป็นภาพรวมระดับแพลตฟอร์ม ไม่ใช่อันดับรายสัปดาห์</p></div>
 <div class="card"><h3>🏷 เลือกแนวทางที่สนใจ</h3><p class="muted">แนวที่มีแหล่งอ้างอิงด้านบน</p><div class="row">${tg(TREND_SRC)}</div><p class="muted" style="margin-top:8px">ไอเดียแนวที่นิยมทั่วไป (ไม่ได้ยืนยันจากอันดับสด)</p><div class="row">${tg(TREND_GEN)}</div>
 <div class="row" style="margin-top:12px"><button class="btn pri" data-a="trendAI" ${busy?'disabled':''}>${busy==='trend'?'<span class="pulse">กำลังวิเคราะห์…</span>':'🔮 ให้เอไอวิเคราะห์เทรนด์ & เสนอแนวปม'}</button>${busy==='trend'?'<button class="btn" data-a="stop">หยุด</button>':''}</div>
 ${trendOut?`<div class="out" id="trendOut" style="margin-top:10px">${esc(trendOut)}</div><div class="row" style="margin-top:8px"><button class="btn" data-a="trendSave">บันทึกเป็นโน้ตเทรนด์ของเรื่อง (เอไอจะใช้ทุกตอน)</button></div>`:'<div id="trendOut"></div>'}
 ${nov.trendNotes?`<label class="l">โน้ตเทรนด์ของเรื่อง</label><textarea data-b="n||trendNotes">${esc(nov.trendNotes)}</textarea>`:''}</div>`}
const TABS=[['bible','📖 เรื่อง'],['chars','👥 ตัวละคร'],['threads','🧵 ปม'],['write','✍️ เขียน'],['trend','📈 เทรนด์']];
function render(){
 const nov=N();$('#novelSel').innerHTML=S.novels.map(x=>`<option value="${x.id}" ${x.id===S.cur?'selected':''}>${esc(x.title||'ไม่มีชื่อ')}</option>`).join('');
 const bad=audit(nov).filter(x=>x.lv==='high').length;
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-a="tab|${k}">${l}${k==='threads'&&bad?` <span class="badge" style="background:var(--bad)">${bad}</span>`:''}</button>`).join('');
 const f={bible:tabBible,chars:tabChars,threads:tabThreads,write:tabWrite,trend:tabTrend}[tab];
 const y=window.scrollY;$('#main').innerHTML=f(nov);window.scrollTo(0,y);
 $('#banner').innerHTML=IS_GEMINI?(gcfg().key?'<div class="muted" style="margin:8px 14px">เอไอ: Gemini ('+esc(gcfg().model||'gemini-flash-latest')+') <button data-a="gemini">เปลี่ยน key/โมเดล</button></div>':'<div class="warn" style="margin:8px 14px">ต้องใส่ Gemini API key (ฟรี) ก่อนใช้เอไอเขียน <button data-a="gemini">ตั้งค่า Gemini</button></div>'):''}

/* ---------- เหตุการณ์ ---------- */
document.addEventListener('input',e=>{const el=e.target,d=el.dataset;if(!d||!d.b||el.tagName==='SELECT')return;setField(el)});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset;if(!d)return;
 if(d.p!==undefined&&d.p!==''){const c=curChapter();if(!c)return;c.plan=(c.plan||[]).filter(p=>p.threadId!==d.p);if(el.value)c.plan.push({threadId:d.p,action:el.value});save();return}
 if(d.b&&el.tagName==='SELECT'){setField(el);if(d.rr)render()}});
function setField(el){const [kind,id,f]=el.dataset.b.split('|');let v=el.value;if(el.type==='number')v=num(v);const nov=N();
 if(kind==='n'){nov[f]=v;if(f==='title'){const o=$(`#novelSel option[value="${nov.id}"]`);if(o)o.textContent=v||'ไม่มีชื่อ'}}
 else if(kind==='c'){const o=findC(nov,id);if(o)o[f]=v}
 else if(kind==='t'){const o=findT(nov,id);if(o){o[f]=v;if(f==='status'&&!o.log.length)o.base=v;if(f==='resolution')o.resolution_manual=v}}
 else if(kind==='h'){const o=nov.chapters.find(x=>x.id===id);if(o){o[f]=v;if(f==='text'){o.trunc=false;if(o.analyzed){o.analyzed=false;}}}}
 save()}
const ACTIONS={
 tab:t=>{tab=t;render()},
 newNovel:()=>{const n=newNovel();S.novels.push(n);S.cur=n.id;curCh=null;tab='bible';save();render()},
 addSetting:(b)=>{const v=b.dataset.v,nov=N();nov.setting=nov.setting?(nov.setting.includes(v)?nov.setting:nov.setting+' / '+v):v;save();render()},
 addRule:()=>{const i=$('#ruleIn');if(i&&i.value.trim()){N().rules.push(i.value.trim());save();render()}},
 quickRule:(b)=>{const nov=N();if(!nov.rules.includes(b.dataset.v))nov.rules.push(b.dataset.v);save();render()},
 delRule:i=>{N().rules.splice(+i,1);save();render()},
 genStarter:()=>genStarter(),applyStarter:()=>applyStarter(),dropStarter:()=>{starter=null;render()},stop:()=>stop(),
 addChar:()=>{N().chars.push({id:uid('c'),name:'ตัวละครใหม่',nick:'',role:'',traits:'',voice:'',secret:''});save();render()},
 delChar:async id=>{if(!await ask('ลบตัวละครนี้? (จะถูกเอาออกจากปมที่เกี่ยวข้องด้วย)','ลบ'))return;const nov=N();nov.chars=nov.chars.filter(c=>c.id!==id);nov.threads.forEach(t=>t.chars=t.chars.filter(x=>x!==id));save();render()},
 addThread:()=>{N().threads.push({id:uid('t'),title:'ปมใหม่',type:'ปริศนา/ความลับ',desc:'',answer:'',status:'planned',base:'planned',plant:'',due:'',links:[],chars:[],resolution:'',log:[]});save();render()},
 delThread:async id=>{if(!await ask('ลบปมนี้ออกจากเรื่อง?','ลบ'))return;const nov=N();nov.threads=nov.threads.filter(t=>t.id!==id);nov.threads.forEach(t=>t.links=t.links.filter(x=>x!==id));nov.chapters.forEach(c=>{c.plan=(c.plan||[]).filter(p=>p.threadId!==id)});save();render()},
 tlink:(a,b)=>{const nov=N(),t=findT(nov,a),o=findT(nov,b);if(!t||!o)return;if(t.links.includes(b)){t.links=t.links.filter(x=>x!==b);o.links=o.links.filter(x=>x!==a)}else{t.links.push(b);o.links.push(a)}save();render()},
 tchar:(a,b)=>{const t=findT(N(),a);if(!t)return;t.chars=t.chars.includes(b)?t.chars.filter(x=>x!==b):[...t.chars,b];save();render()},
 addFact:()=>{const i=$('#factIn');if(i&&i.value.trim()){N().facts.push({id:uid('f'),text:i.value.trim(),ch:0});save();render()}},
 delFact:id=>{const nov=N();nov.facts=nov.facts.filter(f=>f.id!==id);save();render()},
 newChapter:()=>addChapter(),selCh:id=>{curCh=id;render()},
 delCh:async()=>{const c=curChapter();if(!c||!await ask('ลบตอนนี้? ผลต่อปมและข้อเท็จจริงจากตอนนี้จะถูกย้อนกลับด้วย','ลบ'))return;const nov=N();unapply(nov,c.n);nov.chapters=nov.chapters.filter(x=>x.id!==c.id);curCh=null;save();render()},
 write:m=>writeChapter(m),analyze:()=>analyze(),fix:()=>fixIssues(),tweak:()=>{const i=$('#tweakIn');rewrite(i?i.value:'')},
 copyCh:async()=>{const c=curChapter();try{await navigator.clipboard.writeText((c.title?c.title+'\n\n':'')+c.text);toast('คัดลอกแล้ว')}catch(e){toast('คัดลอกไม่ได้ ลองเลือกข้อความแล้วคัดลอกเอง')}},
 trendTag:(b)=>{const nov=N(),v=b.dataset.v;nov.tags=nov.tags.includes(v)?nov.tags.filter(x=>x!==v):[...nov.tags,v];save();render()},
 trendAI:()=>trendAI(),
 gemini:()=>{const c=gcfg();const k=prompt('วาง Gemini API key (ขอฟรีที่ aistudio.google.com/apikey)\nเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น เว้นว่าง = ลบ key',c.key||'');if(k===null)return;const m=k.trim()?prompt('ชื่อโมเดล (เว้นว่างใช้ค่าเริ่มต้น gemini-flash-latest)',c.model||''):'';if(m===null)return;try{if(k.trim())localStorage.setItem(GK,JSON.stringify({key:k.trim(),model:(m||'').trim()}));else localStorage.removeItem(GK)}catch(e){toast('บันทึก key ไม่ได้ในเบราว์เซอร์นี้')}render()},
 trendSave:()=>{const nov=N();nov.trendNotes=trendOut.slice(0,3000);save();toast('บันทึกเป็นโน้ตเทรนด์ของเรื่องแล้ว');render()},
 backup:async()=>{const data=JSON.stringify(S,null,1);try{if(!(window.claude&&window.claude.use)){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='novel-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('ดาวน์โหลดไฟล์สำรองแล้ว');return}const d=await window.claude.use('downloads');if(!d)throw 0;await d.save({filename:'novel-backup-'+new Date().toISOString().slice(0,10)+'.json',data});toast('ส่งไฟล์สำรองแล้ว')}catch(e){if(e&&e.code==='declined')return;try{await navigator.clipboard.writeText(data);toast('ดาวน์โหลดไม่ได้ คัดลอกข้อมูลสำรองไปที่คลิปบอร์ดแทน — วางเก็บในไฟล์ .json')}catch(_){toast('สำรองไม่สำเร็จในมุมมองนี้')}}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const [a,...args]=b.dataset.a.split('|');const f=ACTIONS[a];if(f)f(...args,b);if(a==='newNovel'&&0)return});
document.addEventListener('click',e=>{});
$('#novelSel').addEventListener('change',e=>{S.cur=e.target.value;curCh=null;starter=null;trendOut='';save();render()});
$('#imp').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.novels)||!j.novels.length)throw 0;if(!await ask('นำเข้าไฟล์สำรอง? ข้อมูลปัจจุบันในเบราว์เซอร์นี้จะถูกแทนที่','นำเข้า'))return;S=j;if(!S.novels.find(x=>x.id===S.cur))S.cur=S.novels[0].id;curCh=null;save();render();toast('นำเข้าแล้ว')}catch(err){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของโรงเขียนนิยาย')}});
render();save();getSample().then(()=>render());
})();
</script>
</body></html>
